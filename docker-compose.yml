version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satltis-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
    networks:
      - satltis-network

  # Optionnel : Base de données MySQL pour développement
  # mysql:
  #   image: mysql:8.0
