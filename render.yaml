services:
  - type: web
    name: satltis-scraping
    env: php
    buildCommand: composer install --optimize-autoloader --no-dev && php artisan optimize && php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

